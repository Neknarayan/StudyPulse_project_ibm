<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPulse</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <div class="brand">
    <h1>StudyPulse</h1>
    <small>Academic risk early-warning</small>
  </div>
  <a href="/"        class="{{ 'on' if page=='dashboard' }}">Dashboard</a>
  <a href="/data"    class="{{ 'on' if page=='data' }}">Dataset</a>
  <a href="/eda"     class="{{ 'on' if page=='eda' }}">Data analysis</a>
  <a href="/model"   class="{{ 'on' if page=='model' }}">Model evaluation</a>
  <a href="/predict" class="{{ 'on' if page=='predict' }}">Risk predictor</a>
  <a href="/concept" class="{{ 'on' if page=='concept' }}">Concept Note (IBM)</a>
  <div class="nav-spacer" style="margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1);">
    <div style="font-size:11px;color:#94a3b8;line-height:1.4;">
      <span style="display:inline-block;background:#312e81;color:#c7d2fe;padding:2px 6px;border-radius:4px;font-weight:600;margin-bottom:4px;">IBM SkillsBuild</span><br>
      <span style="display:inline-block;background:#14532d;color:#bbf7d0;padding:2px 6px;border-radius:4px;font-weight:600;margin-bottom:6px;">SDG 4: Education</span><br>
      Neknarayan &bull; UIT-RGPV
    </div>
  </div>
</nav>
<main>
  {% block body %}{% endblock %}
</main>
</body>
</html>
